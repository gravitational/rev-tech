apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tbot.fullname" . }}
  labels:
    {{- include "tbot.labels" . | nindent 4 }}
rules:
  # tbot's `kubernetes_secret` destination creates the Secret if it
  # doesn't exist yet and overwrites its keys on every renewal.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Values.svidOutput.secretName }}"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tbot.fullname" . }}
  labels:
    {{- include "tbot.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "tbot.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tbot.fullname" . }}
    namespace: {{ .Release.Namespace }}
