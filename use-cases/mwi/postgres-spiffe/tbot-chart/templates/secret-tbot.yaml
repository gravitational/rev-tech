{{- if not .Values.teleport.joinToken -}}
{{- fail "teleport.joinToken is required -- pass it with --set-string teleport.joinToken=<token>. See ../teleport/token.yaml and ../setup.sh's generate_join_token for how to create one (there's no `tctl tokens add` equivalent for a bot-scoped token)." -}}
{{- end -}}
# A Secret, not a ConfigMap: this embeds the literal join token value
# (tbot's onboarding.token), which is a bearer credential until tbot
# consumes it on first join.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tbot.fullname" . }}-config
  labels:
    {{- include "tbot.labels" . | nindent 4 }}
stringData:
  tbot.yaml: |
    version: v2
    proxy_server: {{ .Values.teleport.proxyAddress | quote }}

    onboarding:
      join_method: token
      token: {{ .Values.teleport.joinToken | quote }}

    # Persisted via the PVC mounted below so tbot only needs
    # `onboarding.token` for its very first join -- every renewal after
    # that uses tbot's own bot certificate.
    storage:
      type: directory
      path: /var/lib/teleport/bot

    services:
      # Issues a fresh SPIFFE X.509-SVID for the workload_identity named
      # below and writes it to a Kubernetes Secret that other pods in
      # this namespace can mount (see ../../clients/*/chart).
      - type: workload-identity-x509
        selector:
          name: {{ .Values.teleport.workloadIdentityName | quote }}
        destination:
          type: kubernetes_secret
          name: {{ .Values.svidOutput.secretName | quote }}
        credential_ttl: {{ .Values.svidOutput.credentialTTL | quote }}
        renewal_interval: {{ .Values.svidOutput.renewalInterval | quote }}

      # That's it -- no `application-tunnel` output. Once a workload
      # holds the SVID above, it authenticates directly to Postgres over
      # a normal Kubernetes network path (../../clients/*/chart connect
      # straight to the "postgres" Service); Teleport isn't in the data
      # path at all, only in the business of having issued the identity.
      # This is the point being demonstrated: Workload Identity replaces
      # a shared secret, it doesn't require an inline Teleport proxy for
      # every connection the way TCP Application Access does (that's
      # still used for the human/CLI path -- see ../../clients/cli/README.md).
