apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tbot.fullname" . }}
  labels:
    {{- include "tbot.labels" . | nindent 4 }}
# This ServiceAccount's own bound token is what Teleport's `kubernetes`
# join method validates (see ../teleport/token.yaml). It is unrelated to
# the Workload Identity SVIDs tbot subsequently issues to *other* pods.
automountServiceAccountToken: true
