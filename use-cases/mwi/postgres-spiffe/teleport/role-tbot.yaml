# Rendered by ../setup.sh from ${...} placeholders (see ../.env.example)
# and applied with: tctl create -f role-tbot.yaml
#
# Grants the demo bot (see bot.yaml) exactly one thing: permission to
# issue the workload_identity resource. Deliberately NOT app_labels --
# tbot only issues the SVID here, it doesn't tunnel into the Postgres
# TCP Application (see ../tbot-chart/templates/secret-tbot.yaml):
# once a workload holds the SVID, it connects to Postgres directly,
# with no Teleport-mediated network path required. (`app_labels` is
# still granted to the human path in role-human-cli.yaml, which does
# use TCP Application Access via `tsh vnet`.)
kind: role
version: v7
metadata:
  name: ${BOT_NAME}
spec:
  allow:
    workload_identity_labels:
      demo: ["${DEMO_LABEL_VALUE}"]
    rules:
      - resources: [workload_identity]
        verbs: [read, list]
