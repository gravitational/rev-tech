{{/*
Two Secrets, both derived from a self-signed CA + server certificate for
Postgres' *server* TLS identity (nothing to do with Teleport Workload
Identity -- this is just how clients verify they're really talking to
this Postgres instance):

  - "<fullname>-certs": consumed by the bitnami/postgresql subchart via
    `postgresql.tls.certificatesSecret`. Bundles the server cert/key
    together with ca.crt = our own self-signed CA + the Teleport
    Workload Identity trust bundle (spiffeCABundle) + Teleport's
    db_client CA (if databaseAccess.enabled) -- Bitnami expects
    ssl_cert_file/ssl_key_file/ssl_ca_file to all live in one secret,
    and Postgres' ssl_ca_file happily accepts multiple concatenated
    trust anchors.

    Our own CA has to be in there too, and not just "for completeness":
    bitnami/postgresql's own readiness/liveness probes authenticate
    using tls.crt/tls.key as their *client* certificate (`pg_isready -U
    postgres ... sslcert=.../tls.crt sslkey=.../tls.key`), so without
    trusting our own CA here the TLS handshake for the probe itself
    fails and the pod never becomes Ready. See the `hostssl postgres
    postgres 127.0.0.1 trust` line in ../values.yaml's
    pgHbaConfiguration for the other half of that fix (the probe
    connects as "postgres", but the server cert's CN is the Service
    name ("postgres"), so `cert` auth would still reject it on
    username even once the handshake succeeds).
  - "<fullname>-server-ca": just the self-signed CA's public cert, handed
    to the client Helm charts under ../../clients (python and go) so
    they can verify Postgres' server certificate.

The CA/cert pair is generated once and reused on every `helm upgrade`
via `lookup`, so it survives chart upgrades. The spiffeCABundle secret
is expected to already exist (populated by ../../setup.sh or by hand --
see ../../clients/cli/README.md step 2) before this chart is installed.
*/}}
{{- $fullname := include "postgres.fullname" . -}}
{{- $caSecretName := printf "%s-server-ca" $fullname -}}
{{- $certsSecretName := .Values.postgresql.tls.certificatesSecret -}}
{{- $spiffeBundle := lookup "v1" "Secret" .Release.Namespace .Values.spiffeCABundle.secretName -}}
{{- if not $spiffeBundle -}}
{{- fail (printf "Secret %q (spiffeCABundle.secretName) not found in namespace %q -- create it from your Teleport Workload Identity trust bundle before installing this chart. See ../../setup.sh or clients/cli/README.md step 2." .Values.spiffeCABundle.secretName .Release.Namespace) -}}
{{- end -}}
{{- $spiffeBundlePEM := index $spiffeBundle.data .Values.spiffeCABundle.secretKey | b64dec -}}
{{- $dbClientCAPEM := "" -}}
{{- if .Values.databaseAccess.enabled -}}
{{- $dbClientCA := lookup "v1" "Secret" .Release.Namespace .Values.databaseAccess.caBundle.secretName -}}
{{- if not $dbClientCA -}}
{{- fail (printf "Secret %q (databaseAccess.caBundle.secretName) not found in namespace %q -- create it from `tctl auth export --type=db-client`, or set databaseAccess.enabled=false if you don't want the Teleport Database Access / auto-user-provisioning path. See ../../setup.sh (ENABLE_DB_SERVICE) or ../../teleport/README.md." .Values.databaseAccess.caBundle.secretName .Release.Namespace) -}}
{{- end -}}
{{- $dbClientCAPEM = index $dbClientCA.data .Values.databaseAccess.caBundle.secretKey | b64dec -}}
{{- end -}}
{{- $existingCA := lookup "v1" "Secret" .Release.Namespace $caSecretName -}}
{{- $existingCerts := lookup "v1" "Secret" .Release.Namespace $certsSecretName -}}
{{- $ca := dict -}}
{{- $cert := dict -}}
{{- if $existingCA -}}
{{/* `genSignedCert` below requires the CA it signs against to be the
     typed object `genCA` returns, not a plain dict -- `buildCustomCert`
     reconstructs that type from base64-encoded PEM strings (which is
     exactly the format `lookup`'s `.data` map already holds, being a
     Kubernetes Secret's raw `data` field). A plain `dict "Cert" ...
     "Key" ...` looks identical when just read back out (.Cert/.Key
     below), but fails type assertions inside sprig's cert-signing
     functions. */}}
{{- $ca = buildCustomCert (index $existingCA.data "ca.crt") (index $existingCA.data "ca.key") -}}
{{- else -}}
{{- $ca = genCA (printf "%s-ca" $fullname) (.Values.tls.caDays | int) -}}
{{- end -}}
{{- if and $existingCA $existingCerts -}}
{{/* Reuse the existing server cert/key verbatim -- only ca.crt (the
     SPIFFE bundle, tracked separately below) is allowed to change on
     upgrade. Regenerating the server cert on every `helm upgrade` for
     no reason would churn a Secret bitnami/postgresql doesn't
     automatically hot-reload from anyway. */}}
{{- $cert = dict "Cert" (index $existingCerts.data .Values.postgresql.tls.certFilename | b64dec) "Key" (index $existingCerts.data .Values.postgresql.tls.certKeyFilename | b64dec) -}}
{{- else -}}
{{/* bitnami/postgresql's Service name with `architecture: standalone`
     is just the fullname itself -- no "-primary" suffix (that only
     appears with `architecture: replication`, where primary/read
     replicas need distinct names). Confirmed by installing this chart:
     `architecture: standalone` + `fullnameOverride: postgres` produces
     a Service literally named "postgres". */}}
{{- $pgHost := .Values.postgresql.fullnameOverride -}}
{{- $altNames := list $pgHost (printf "%s.%s" $pgHost .Release.Namespace) (printf "%s.%s.svc" $pgHost .Release.Namespace) (printf "%s.%s.svc.cluster.local" $pgHost .Release.Namespace) "localhost" -}}
{{- $cert = genSignedCert $pgHost nil $altNames (.Values.tls.certDays | int) $ca -}}
{{- end -}}
{{- $trustedCAsPEM := list $ca.Cert $spiffeBundlePEM $dbClientCAPEM | compact | join "\n" -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $caSecretName }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
  annotations:
    # Handed to client Helm charts (see ../../clients/*/chart) so they
    # can verify Postgres' server certificate.
    postgres-wi-demo.teleport.dev/purpose: "server-ca-for-clients"
type: Opaque
data:
  ca.crt: {{ $ca.Cert | b64enc }}
  ca.key: {{ $ca.Key | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $certsSecretName }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.postgresql.tls.certFilename }}: {{ $cert.Cert | b64enc }}
  {{ .Values.postgresql.tls.certKeyFilename }}: {{ $cert.Key | b64enc }}
  {{ .Values.postgresql.tls.certCAFilename }}: {{ $trustedCAsPEM | b64enc }}
