# Values for THIS wrapper chart (consumed by templates/tls-secrets.yaml).
# Keep fullnameOverride in sync with `postgresql.fullnameOverride` below
# -- they name two different sets of resources (this chart's Secrets vs.
# the bitnami/postgresql subchart's own resources) that have to agree on
# the "postgres-certs" Secret name in between.
nameOverride: ""
fullnameOverride: "postgres"

tls:
  # Validity (days) of the self-signed CA/server cert this chart
  # generates for Postgres' *server* identity. Unrelated to the client
  # SVID trust bundle below.
  caDays: 3650
  certDays: 825

# Trust bundle used to verify *client* certificates (the SPIFFE X.509-SVIDs
# issued by Teleport Workload Identity). This chart does not fetch it for
# you: populate it once from your Teleport cluster (../setup.sh does
# this, or see ../clients/cli/README.md step 2 to do it by hand) and
# reference it here.
#
# Format expected inside the secret: a PEM file (possibly containing
# multiple CA certificates concatenated) under `secretKey`.
spiffeCABundle:
  secretName: "teleport-spiffe-ca"
  secretKey: "bundle.pem"

# Optional second access path, alongside Workload Identity: plain
# Teleport Database Access with automatic user provisioning, so a human
# with `tsh` can run `tsh db connect` and get their own auto-created
# Postgres login instead of sharing "app_user". Controlled end-to-end by
# ENABLE_DB_SERVICE in ../.env -- when false, ../setup.sh never creates
# the secret this points at, and `databaseAccess.enabled: false` (set by
# ../setup.sh via --set) makes templates/tls-secrets.yaml skip looking
# for it entirely, so ca.crt below is just the Workload Identity bundle
# alone. See ../teleport/role-db-access.yaml and ../teleport/db.yaml.
databaseAccess:
  enabled: true
  caBundle:
    secretName: "teleport-db-client-ca"
    secretKey: "db-client.cas"

# --- Everything below is passed straight through to bitnami/postgresql ---
# https://github.com/bitnami/charts/tree/main/bitnami/postgresql
#
# If you change the app user ("app_user") or database name ("demo"),
# update BOTH `primary.pgHbaConfiguration` and `primary.initdb.scripts`
# below to match -- Helm doesn't template values.yaml, so these can't
# cross-reference a single variable the way the chart's *templates* can.
postgresql:
  fullnameOverride: "postgres" # -> `architecture: standalone` Service is just "postgres" (no "-primary" suffix; that only appears under `architecture: replication`)
  architecture: standalone

  auth:
    # Bitnami's own bootstrap wants a superuser password to exist even
    # though nothing in this demo ever authenticates as `postgres` over
    # the network (pg_hba below only allows `cert` auth for `app_user`).
    # Left blank, Bitnami generates a random one into its own Secret.
    enablePostgresUser: true

  tls:
    enabled: true
    autoGenerated: false
    # Produced by templates/tls-secrets.yaml: tls.crt/tls.key are a
    # self-signed server cert+key, ca.crt is the *Teleport* Workload
    # Identity bundle (spiffeCABundle above) -- i.e. the file Postgres
    # uses to verify incoming client SVIDs, not something related to
    # tls.crt's own issuer.
    certificatesSecret: "postgres-certs"
    certFilename: "tls.crt"
    certKeyFilename: "tls.key"
    certCAFilename: "ca.crt"

  primary:
    pgHbaConfiguration: |
      # Local socket, used by Bitnami's own bootstrap/initdb scripts and
      # by `psql` run via `kubectl exec` for troubleshooting.
      local    all               all                                     trust

      # bitnami/postgresql's own readiness/liveness probes connect as
      # "postgres" from inside the pod itself, presenting the server's
      # OWN certificate (CN = the Service name, "postgres" by default
      # per fullnameOverride below) as their client cert. That happens
      # to match the database user "postgres" the probe connects as
      # with this chart's default naming, but don't rely on that if you
      # change fullnameOverride -- this explicit loopback-only `trust`
      # bypass keeps the probe working regardless. It can't be reached
      # from outside this pod.
      hostssl  all               postgres                127.0.0.1/32    trust
      hostssl  all               postgres                ::1/128         trust

      # Every other connection MUST arrive over TLS and present a client
      # certificate signed by a CA in tls.certCAFilename above (the
      # Teleport Workload Identity bundle, plus -- if
      # databaseAccess.enabled -- Teleport's db_client CA). `cert` auth
      # then matches the connecting Postgres username against the
      # certificate's CN, which is *per connection*, not per pg_hba
      # line: this one broad rule covers both the static "app_user"
      # workload identity CN (../teleport/workload_identity.yaml) and
      # whatever per-user CN Teleport's Database Service presents for
      # auto-provisioned users (../teleport/role-db-access.yaml).
      hostssl  all               all                     0.0.0.0/0       cert
      hostssl  all               all                     ::/0            cert

      # Everything else (non-TLS, or TLS without a matching rule above)
      # is rejected outright.
      host     all               all                     0.0.0.0/0       reject
      host     all               all                     ::/0            reject

    initdb:
      scripts:
        01-app-user-and-schema.sql: |
          -- No password: authentication is entirely via client
          -- certificate (see pgHbaConfiguration's `cert` method), so
          -- this role can't log in any other way.
          CREATE ROLE app_user LOGIN;
          CREATE DATABASE demo OWNER app_user;

        02-sample-schema.sql: |
          \connect demo

          CREATE TABLE IF NOT EXISTS transactions (
              id          SERIAL PRIMARY KEY,
              account     TEXT NOT NULL,
              amount      NUMERIC(12,2) NOT NULL,
              description TEXT,
              created_at  TIMESTAMPTZ NOT NULL DEFAULT now()
          );

          INSERT INTO transactions (account, amount, description) VALUES
              ('seed-001', 100.00, 'Initial seed deposit'),
              ('seed-002', -25.50, 'Initial seed withdrawal');

          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO app_user;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO app_user;

        03-teleport-db-service.sql: |
          -- Bootstrap role Teleport's Database Service authenticates as
          -- (via a client cert signed by Teleport's db_client CA, see
          -- databaseAccess above) to create and manage auto-provisioned
          -- per-Teleport-user Postgres roles. Harmless if
          -- ENABLE_DB_SERVICE=false in ../.env -- nothing can log in as
          -- this role without a matching certificate.
          CREATE USER "teleport-admin" LOGIN CREATEROLE;
          GRANT USAGE ON SCHEMA public TO "teleport-admin";
          GRANT CREATE ON SCHEMA public TO "teleport-admin";

          -- Privilege groups auto-provisioned users are granted into,
          -- selected per-session via ../teleport/role-db-access.yaml's
          -- `db_roles`. Postgres 16+ requires the explicit ADMIN OPTION
          -- grant below so teleport-admin can itself grant these to the
          -- users it creates.
          \connect demo

          CREATE ROLE reader;
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO reader;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO reader;
          GRANT reader TO "teleport-admin" WITH ADMIN OPTION;

          CREATE ROLE writer;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO writer;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO writer;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO writer;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO writer;
          GRANT writer TO "teleport-admin" WITH ADMIN OPTION;

    persistence:
      size: 1Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
