name: cloud
# Teleport Cloud. The auth/proxy diagnostics endpoint is not scrapeable and there
# is no backend database, so no Prometheus or SQL panel survives. Until the usage
# exporter existed this profile rendered nothing at all; the exporter reads the
# API instead, which Cloud does expose, so Cloud now gets real posture panels.
capabilities:
  # The exporter reaches the Teleport API, which Cloud does expose -- so it is
  # the one source that works here, and the reason this profile is no longer
  # empty. Everything else (scraped diagnostics, a backend database, the Access
  # Graph) is unavailable on Cloud.
  - usageExporter
variables:
  prom_retention: 15d
  audit_retention: 30d
